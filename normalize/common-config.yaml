removeFields:
  # Server-managed metadata and status.
  - fields:
      - metadata.creationTimestamp
      - metadata.generation
      - metadata.managedFields
      - metadata.ownerReferences
      - metadata.resourceVersion
      - metadata.uid
      - metadata.annotations.deployment\.kubernetes\.io/revision
      - metadata.annotations.clusterctl\.cluster\.x-k8s\.io
      - metadata.annotations.kubectl\.kubernetes\.io/last-applied-configuration
      - metadata.annotations.deprecated\.daemonset\.template\.generation

      # kapp adds its app/association tracking labels and annotations to every
      # managed resource, including pod template labels and selectors. Use ...
      # with a glob to catch all kapp.k14s.io/* keys at any nesting depth.
      - ...kapp\.k14s\.io/*

      # Tracking labels and annotations of GitOps tools. They name the tool
      # object that applied the resource, not the desired state. Other
      # kustomize.toolkit.fluxcd.io/* annotations (prune, ssa, ...) are
      # settings and stay.
      - metadata.labels.argocd\.argoproj\.io/instance
      - metadata.annotations.argocd\.argoproj\.io/tracking-id
      - metadata.labels.helm\.toolkit\.fluxcd\.io/name
      - metadata.labels.helm\.toolkit\.fluxcd\.io/namespace
      - metadata.labels.kustomize\.toolkit\.fluxcd\.io/name
      - metadata.labels.kustomize\.toolkit\.fluxcd\.io/namespace

      # Helm sets these labels automatically on every managed resource,
      # including pod template labels. The chart version is redundant with
      # the container image tag. Use ... to remove at any nesting depth.
      - ...labels.helm\.sh/chart
      - path: ...labels.app\.kubernetes\.io/managed-by
        value: Helm
      # Ownership annotations Helm writes on install/upgrade. Rendered
      # manifests (helm template, RMP) never contain them.
      - metadata.annotations.meta\.helm\.sh/release-name
      - metadata.annotations.meta\.helm\.sh/release-namespace

      # Runtime-volatile annotations set by tools, not by the user.
      # change-cause is top-level. Restarts (kubectl rollout restart, keel,
      # Rancher "Redeploy") write a timestamp into the pod template
      # annotations ("...template" also matches a CronJob's jobTemplate).
      - metadata.annotations.kubernetes\.io/change-cause
      # Not "...annotations": that would also match free-form content of
      # custom resources (Helm values of a HelmRelease), where a timestamp
      # can be set on purpose to force a rollout.
      - metadata.annotations.keel\.sh/update-time
      - ...template.metadata.annotations.keel\.sh/update-time
      - metadata.annotations.kubectl\.kubernetes\.io/restartedAt
      - ...template.metadata.annotations.kubectl\.kubernetes\.io/restartedAt
      - metadata.annotations.cattle\.io/timestamp
      - ...template.metadata.annotations.cattle\.io/timestamp

      - status
      # Remove empty labels/annotations maps. Helm often renders these as explicit
      # null; the API server may return {}. Both are noise in source-controlled YAML.
      - path: metadata.labels
        omitempty: true
      - path: metadata.annotations
        omitempty: true
  # In the typed built-in APIs a null field and an empty list are the same as
  # an absent one: the API server stores them alike and never returns [].
  # Helm renders empty values as null or []; the API server returns null for
  # some fields (Role rules). Custom resources keep them: in free-form fields
  # (Helm values of a HelmRelease) null can mean "delete this default".
  # Runs before the {} rules below, so they see the emptied parents.
  - group: ""
    fields: &nullFields
      - path: ...*
        value: null
      - path: ...*
        value: []
  - group: apps
    fields: *nullFields
  - group: batch
    fields: *nullFields
  - group: autoscaling
    fields: *nullFields
  - group: policy
    fields: *nullFields
  - group: "*.k8s.io"
    fields: *nullFields

  # Namespace-specific noise added by the API server.
  - kind: Namespace
    fields:
      - metadata.labels.kubernetes\.io/metadata\.name
      - spec.finalizers
      # API server returns spec: {} even when no spec was written.
      - path: spec
        value: {}
  # Webhook defaults and injected CA bundles. Values other than the defaults
  # are explicit choices and kept.
  - group: admissionregistration.k8s.io
    kind: "*WebhookConfiguration"
    fields:
      - webhooks.clientConfig.caBundle
      - path: webhooks.failurePolicy
        value: Fail
      - path: webhooks.clientConfig.service.port
        value: 443
      - path: webhooks.matchPolicy
        value: Equivalent
      - path: webhooks.namespaceSelector
        value: {}
      - path: webhooks.objectSelector
        value: {}
      - path: webhooks.reinvocationPolicy
        value: Never
      - path: webhooks.rules.scope
        value: "*"
      - path: webhooks.timeoutSeconds
        value: 10
  # Defaults of ValidatingAdmissionPolicy and MutatingAdmissionPolicy.
  - group: admissionregistration.k8s.io
    kind: "*AdmissionPolicy"
    fields:
      - path: spec.failurePolicy
        value: Fail
      - path: spec.matchConstraints.matchPolicy
        value: Equivalent
      - path: spec.matchConstraints.namespaceSelector
        value: {}
      - path: spec.matchConstraints.objectSelector
        value: {}
      - path: spec.matchConstraints.resourceRules.scope
        value: "*"
  # CRD conversion webhook defaults and None-strategy cleanup.
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    fields:
      - spec.conversion.webhook.clientConfig.caBundle
      - path: spec.conversion.webhook.clientConfig.service.port
        value: 443
      # CRDs without webhook conversion have spec.conversion: {strategy: None}.
      # Removing strategy (only when None) leaves an empty map, then removes it.
      # CRDs with webhook conversion keep strategy: Webhook and all webhook fields.
      - path: spec.conversion.strategy
        value: None
      - path: spec.conversion
        value: {}

  # ── PersistentVolumeClaim ────────────────────────────────────────────────────
  - kind: PersistentVolumeClaim
    fields:
      # Annotations written by the PV controller at bind time. Never in user YAML.
      - metadata.annotations.pv\.kubernetes\.io/bind-completed
      - metadata.annotations.pv\.kubernetes\.io/bound-by-controller
      - metadata.annotations.volume\.kubernetes\.io/storage-provisioner
      - metadata.annotations.volume\.beta\.kubernetes\.io/storage-provisioner
      # Added by the pvc-protection controller. Matches the exact single-item list.
      - path: metadata.finalizers
        value:
          - kubernetes.io/pvc-protection
      - path: metadata.finalizers
        omitempty: true
      # Filled by the API server when the claim is bound. Never in user YAML.
      - spec.volumeName
      # Default mode. Block would be an explicit user choice.
      - path: spec.volumeMode
        value: Filesystem

  # ── Service ───────────────────────────────────────────────────────────────────
  - kind: Service
    fields:
      # Assigned by the API server from the cluster's service CIDR at creation
      # time. Never written in source YAML. Changes on every new Service object.
      # None (headless Service) is an explicit choice and kept.
      - path: spec.clusterIP
        exceptValue: None
      - path: spec.clusterIPs
        exceptValue: [None]

      # Derived from the cluster's primary IP family; varies between IPv4-only,
      # IPv6-only, and dual-stack clusters. Never written in source YAML.
      - spec.ipFamilies

      # Default: SingleStack. The API server writes it when the field is omitted.
      # PreferDualStack and RequireDualStack are explicit user choices and are
      # retained by the value constraint.
      - path: spec.ipFamilyPolicy
        value: SingleStack

      # Default: Cluster. API server writes it even when the field is omitted.
      - path: spec.internalTrafficPolicy
        value: Cluster

      # Default: None. Only alternative is ClientIP, which would be explicit.
      - path: spec.sessionAffinity
        value: None

      # Default protocol for Service ports. UDP/SCTP would be explicit.
      - path: spec.ports.protocol
        value: TCP
      - path: spec.ports.name
        value: ""
      - path: spec.publishNotReadyAddresses
        value: false

      # Default Service type. NodePort/LoadBalancer/ExternalName would be explicit.
      - path: spec.type
        value: ClusterIP
      # targetPort defaults to the same value as port; only remove it when it hasn't been set explicitly.
      - path: spec.ports.targetPort
        omitIfEqualToSibling: port
      # nodePort is auto-assigned by the API server; user manifests rarely pin it.
      - spec.ports.nodePort
      # Defaults for NodePort/LoadBalancer Services. Local / false are explicit.
      - path: spec.externalTrafficPolicy
        value: Cluster
      - path: spec.allocateLoadBalancerNodePorts
        value: true

  # ── Secret ────────────────────────────────────────────────────────────────────
  - kind: Secret
    fields:
      # Default Secret type.
      - path: type
        value: Opaque
      - path: data
        value: {}
      - path: stringData
        value: {}

  - group: apiregistration.k8s.io
    kind: APIService
    fields:
      - path: spec.service.port
        value: 443

  - group: storage.k8s.io
    kind: StorageClass
    fields:
      - path: reclaimPolicy
        value: Delete
      - path: volumeBindingMode
        value: Immediate

  # ── ConfigMap ─────────────────────────────────────────────────────────────────
  - kind: ConfigMap
    fields:
      # Empty data maps are equivalent to absent data.
      - path: data
        value: {}

  # ── Pod templates of workloads ────────────────────────────────────────────────
  # Defaults of the pod template, shared by Deployment, StatefulSet, DaemonSet,
  # Job and CronJob via a YAML anchor. "...template" matches spec.template and
  # spec.jobTemplate.spec.template. Fields are removed leaf-to-root, so an
  # emptied parent matches its {} rule afterwards.
  - group: apps
    kind: "*"
    fields: &podTemplateDefaults
      # Always null in the API response for pod templates.
      - ...template.metadata.creationTimestamp
      - path: ...template.metadata.labels
        omitempty: true
      - path: ...template.metadata.annotations
        omitempty: true
      - path: ...template.metadata
        value: {}

      # Always is the only valid value for Deployment/StatefulSet/DaemonSet;
      # Jobs must set OnFailure or Never explicitly.
      - path: ...template.spec.restartPolicy
        value: Always
      - path: ...template.spec.schedulerName
        value: default-scheduler
      - path: ...template.spec.dnsPolicy
        value: ClusterFirst
      - path: ...template.spec.terminationGracePeriodSeconds
        value: 30
      - path: ...template.spec.hostNetwork
        value: false
      - path: ...template.spec.hostPID
        value: false
      - path: ...template.spec.hostIPC
        value: false
      # Optional strings (omitempty): the API server drops "".
      - path: ...template.spec.hostname
        value: ""
      - path: ...template.spec.nodeName
        value: ""
      - path: ...template.spec.priorityClassName
        value: ""
      - path: ...template.spec.serviceAccountName
        value: ""
      - path: ...template.spec.subdomain
        value: ""
      # Deprecated alias for serviceAccountName, copied by the API server.
      - ...template.spec.serviceAccount
      - path: ...template.spec.nodeSelector
        value: {}
      - path: ...template.spec.affinity.nodeAffinity
        value: null
      - path: ...template.spec.affinity.podAffinity
        value: null
      - path: ...template.spec.securityContext
        value: {}

      # Containers. imagePullPolicy defaults to IfNotPresent for pinned tags;
      # Always (the default for :latest) is kept, it may be explicit.
      - path: ...template.spec.*ontainers.terminationMessagePath
        value: /dev/termination-log
      - path: ...template.spec.*ontainers.terminationMessagePolicy
        value: File
      - path: ...template.spec.*ontainers.imagePullPolicy
        value: IfNotPresent
      - path: ...template.spec.*ontainers.env.valueFrom.fieldRef.apiVersion
        value: v1
      # Optional strings (omitempty): the API server drops "".
      - path: ...template.spec.*ontainers.env.value
        value: ""
      - path: ...template.spec.*ontainers.envFrom.prefix
        value: ""
      - path: ...template.spec.*ontainers.workingDir
        value: ""
      - path: ...template.spec.*ontainers.ports.protocol
        value: TCP
      - path: ...template.spec.*ontainers.ports.name
        value: ""
      - path: ...template.spec.*ontainers.ports.hostIP
        value: ""
      - path: ...template.spec.*ontainers.ports.hostPort
        value: 0
      - path: ...template.spec.*ontainers.stdin
        value: false
      - path: ...template.spec.*ontainers.stdinOnce
        value: false
      - path: ...template.spec.*ontainers.tty
        value: false
      - path: ...template.spec.*ontainers.volumeMounts.readOnly
        value: false
      - path: ...template.spec.*ontainers.volumeMounts.subPath
        value: ""
      - path: ...template.spec.*ontainers.volumeMounts.subPathExpr
        value: ""
      - path: ...template.spec.*ontainers.volumeMounts
        value: null
      - path: ...template.spec.*ontainers.resources.limits
        value: {}
      - path: ...template.spec.*ontainers.resources.requests
        value: {}
      - path: ...template.spec.*ontainers.resources
        value: {}

      # Probe defaults.
      - path: ...template.spec.*ontainers.*Probe.initialDelaySeconds
        value: 0
      - path: ...template.spec.*ontainers.*Probe.failureThreshold
        value: 3
      - path: ...template.spec.*ontainers.*Probe.successThreshold
        value: 1
      - path: ...template.spec.*ontainers.*Probe.timeoutSeconds
        value: 1
      - path: ...template.spec.*ontainers.*Probe.periodSeconds
        value: 10
      - path: ...template.spec.*ontainers.*Probe.httpGet.scheme
        value: HTTP
      - path: ...template.spec.*ontainers.*Probe.tcpSocket.protocol
        value: TCP
      - path: ...template.spec.*ontainers.*Probe.grpc.service
        value: ""

      # Volumes. File mode 0644 (decimal 420).
      - path: ...template.spec.volumes.configMap.defaultMode
        value: 420
      - path: ...template.spec.volumes.secret.defaultMode
        value: 420
      - path: ...template.spec.volumes.projected.defaultMode
        value: 420
      - path: ...template.spec.volumes.downwardAPI.defaultMode
        value: 420
      - path: ...template.spec.volumes.emptyDir.medium
        value: ""
      - path: ...template.spec.volumes.hostPath.type
        value: ""
      - path: ...template.spec.volumes.projected.sources.serviceAccountToken.expirationSeconds
        value: 3600

  - group: apps
    kind: "*"
    fields:
      - path: spec.minReadySeconds
        value: 0

  - group: apps
    kind: Deployment
    fields:
      - path: spec.paused
        value: false
      - path: spec.progressDeadlineSeconds
        value: 600
      - path: spec.revisionHistoryLimit
        value: 10
      # Default RollingUpdate strategy, leaf-to-root. Recreate and other
      # maxSurge/maxUnavailable values are explicit and kept.
      - path: spec.strategy.rollingUpdate.maxSurge
        value: 25%
      - path: spec.strategy.rollingUpdate.maxUnavailable
        value: 25%
      - path: spec.strategy.rollingUpdate
        value: {}
      - path: spec.strategy.type
        value: RollingUpdate
      - path: spec.strategy
        value: {}

  - group: apps
    kind: StatefulSet
    fields:
      - path: spec.podManagementPolicy
        value: OrderedReady
      - path: spec.revisionHistoryLimit
        value: 10
      - path: spec.updateStrategy.rollingUpdate.partition
        value: 0
      - path: spec.updateStrategy.rollingUpdate
        value: {}
      - path: spec.updateStrategy.type
        value: RollingUpdate
      - path: spec.updateStrategy
        value: {}
      - path: spec.persistentVolumeClaimRetentionPolicy.whenDeleted
        value: Retain
      - path: spec.persistentVolumeClaimRetentionPolicy.whenScaled
        value: Retain
      - path: spec.persistentVolumeClaimRetentionPolicy
        value: {}
      # The API server adds apiVersion, kind and status to inline PVC templates.
      - spec.volumeClaimTemplates.apiVersion
      - spec.volumeClaimTemplates.kind
      - spec.volumeClaimTemplates.status
      - path: spec.volumeClaimTemplates.spec.volumeMode
        value: Filesystem

  - group: apps
    kind: DaemonSet
    fields:
      - path: spec.revisionHistoryLimit
        value: 10
      - path: spec.updateStrategy.rollingUpdate.maxUnavailable
        value: 1
      - path: spec.updateStrategy.rollingUpdate.maxSurge
        value: 0
      - path: spec.updateStrategy.rollingUpdate
        value: {}
      - path: spec.updateStrategy.type
        value: RollingUpdate
      - path: spec.updateStrategy
        value: {}

  # Labels and selector the Job controller generates from the Job's uid and
  # name (unless manualSelector is used). Must run before the shared
  # template rules, which then remove the emptied labels map.
  - group: batch
    fields:
      - ...template.metadata.labels.batch\.kubernetes\.io/controller-uid
      - ...template.metadata.labels.batch\.kubernetes\.io/job-name
      - ...template.metadata.labels.controller-uid
      - ...template.metadata.labels.job-name
  # The same labels on the Job itself.
  - group: batch
    kind: Job
    fields:
      - metadata.labels.batch\.kubernetes\.io/controller-uid
      - metadata.labels.batch\.kubernetes\.io/job-name
      - metadata.labels.controller-uid
      - metadata.labels.job-name
      - path: metadata.labels
        omitempty: true
  - group: batch
    kind: "*"
    fields: *podTemplateDefaults

  - group: batch
    kind: Job
    fields:
      - path: spec.backoffLimit
        value: 6
      - path: spec.completionMode
        value: NonIndexed
      - path: spec.completions
        value: 1
      - path: spec.parallelism
        value: 1
      - path: spec.suspend
        value: false
      - path: spec.manualSelector
        value: false
      - path: spec.podReplacementPolicy
        value: TerminatingOrFailed
      - spec.selector.matchLabels.batch\.kubernetes\.io/controller-uid
      - path: spec.selector.matchLabels
        omitempty: true
      - path: spec.selector
        value: {}

  - group: batch
    kind: CronJob
    fields:
      - path: spec.suspend
        value: false
      - path: spec.concurrencyPolicy
        value: Allow
      - path: spec.successfulJobsHistoryLimit
        value: 3
      - path: spec.failedJobsHistoryLimit
        value: 1
      - spec.jobTemplate.metadata.creationTimestamp
      - path: spec.jobTemplate.metadata
        value: {}

  # ── HorizontalPodAutoscaler ───────────────────────────────────────────────────
  - group: autoscaling
    kind: HorizontalPodAutoscaler
    fields:
      # Default: 1.
      - path: spec.minReplicas
        value: 1

  # ── NetworkPolicy ────────────────────────────────────────────────────────────
  - group: networking.k8s.io
    kind: NetworkPolicy
    fields:
      # Default protocol for NetworkPolicy port rules.
      - path: spec.ingress.ports.protocol
        value: TCP
      - path: spec.egress.ports.protocol
        value: TCP

  # ── RoleBinding / ClusterRoleBinding ──────────────────────────────────────────
  - group: rbac.authorization.k8s.io
    kind: "*RoleBinding"
    fields:
      # The API server omits apiGroup: "" on ServiceAccount subjects (it is the
      # implicit default). Helm-rendered manifests often include it explicitly.
      - path: subjects.apiGroup
        value: ""

# Quantities (cpu, memory, storage, ...) are rewritten to the canonical form
# the api-server returns: 1000m -> "1", 0.5 -> 500m, 1024Mi -> 1Gi, 2 -> "2".
quantityFields:
  - kind: Pod
    fields: &podSpecQuantities
      # containers, initContainers and ephemeralContainers.
      - ...*ontainers.resources.limits.*
      - ...*ontainers.resources.requests.*
      # Pod-level resources (PodLevelResources).
      - ...spec.resources.limits.*
      - ...spec.resources.requests.*
      - ...spec.overhead.*
      - ...volumes.emptyDir.sizeLimit
      - ...volumes.ephemeral.volumeClaimTemplate.spec.resources.requests.*
      - ...volumes.ephemeral.volumeClaimTemplate.spec.resources.limits.*
  - kind: PodTemplate
    fields: *podSpecQuantities
  - kind: ReplicationController
    fields: *podSpecQuantities
  - group: apps
    kind: "*"
    fields: *podSpecQuantities
  - group: batch
    kind: "*"
    fields: *podSpecQuantities
  - group: apps
    kind: StatefulSet
    fields:
      - spec.volumeClaimTemplates.spec.resources.requests.*
      - spec.volumeClaimTemplates.spec.resources.limits.*
  - kind: PersistentVolumeClaim
    fields:
      - spec.resources.requests.*
      - spec.resources.limits.*
  - kind: PersistentVolume
    fields:
      - spec.capacity.*
  - kind: ResourceQuota
    fields:
      - spec.hard.*
  - kind: LimitRange
    fields:
      - spec.limits.default.*
      - spec.limits.defaultRequest.*
      - spec.limits.max.*
      - spec.limits.min.*
      - spec.limits.maxLimitRequestRatio.*

skipResources:
  # Ephemeral metrics resources
  - group: metrics.k8s.io
    kind: PodMetrics
  - group: metrics.k8s.io
    kind: NodeMetrics

  # Runtime Pod resources (usually managed by Deployments/StatefulSets/DaemonSets)
  - kind: Pod

  # Events are runtime records, never desired state.
  - kind: Event

  # Node resources (representing physical/virtual machines)
  - kind: Node

  # IP address allocations
  - group: networking.k8s.io
    kind: IPAddress

  # Volume attachments created dynamically by the PV controller
  - group: storage.k8s.io
    kind: VolumeAttachment

  # CertificateSigningRequest resources
  - group: certificates.k8s.io
    kind: CertificateSigningRequest

  # Controller revisions (history of DaemonSets/StatefulSets)
  - group: apps
    kind: ControllerRevision

  # Cert-manager transient validation resources
  - group: cert-manager.io
    kind: CertificateRequest
  - group: acme.cert-manager.io
    kind: Order
  - group: acme.cert-manager.io
    kind: Challenge

  # Automatically injected root CA certificate configmap
  - kind: ConfigMap
    name: kube-root-ca.crt

  # Helm release metadata secrets
  - kind: Secret
    name: "sh.helm.release.v1.*"
