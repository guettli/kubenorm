---
apiVersion: batch/v1
kind: Job
metadata:
  name: pfp
  namespace: default
spec:
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes:
        operator: In
        values:
        - 42
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
      - status: "False"
        type: ConfigIssue
  template:
    spec:
      containers:
      - image: busybox:1.36
        name: c
      restartPolicy: Never
