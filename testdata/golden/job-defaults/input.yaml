# Job defaults that depend on other fields (verified with
# kubectl create --dry-run=server). Each Job notes how the API server stores
# it; Jobs with the same stored spec must normalize alike, the others not.
# stored: completions 1, parallelism 1
apiVersion: batch/v1
kind: Job
metadata:
  name: none
  namespace: default
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: c
        image: busybox:1.36
---
# stored: completions 1, parallelism 1 (same as none)
apiVersion: batch/v1
kind: Job
metadata:
  name: c1
  namespace: default
spec:
  completions: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: c
        image: busybox:1.36
---
# stored: completions 1, parallelism 1 (same as none)
