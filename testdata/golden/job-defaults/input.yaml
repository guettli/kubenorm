# stored: podReplacementPolicy Failed
apiVersion: batch/v1
kind: Job
metadata:
  name: pfp
  namespace: default
spec:
  podReplacementPolicy: Failed
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes:
        operator: In
        values:
        - 42
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
        status: "True"
      - type: ConfigIssue
        status: "False"
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: c
        image: busybox:1.36
