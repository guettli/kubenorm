apiVersion: apps/v1
kind: Deployment
metadata:
  name: liqo-metric-agent
  labels:
    app.kubernetes.io/name: "metric-agent"
    app.kubernetes.io/instance: "liqo-metric-agent"
    app.kubernetes.io/component: "metrics"
    app.kubernetes.io/part-of: "liqo"
    helm.sh/chart: "liqo-v1.3.0"
    app.kubernetes.io/version: "v1.3.0"
    app.kubernetes.io/managed-by: "Helm"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: "metric-agent"
      app.kubernetes.io/instance: "liqo-metric-agent"
      app.kubernetes.io/component: "metrics"
      app.kubernetes.io/part-of: "liqo"
      run: metric-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "metric-agent"
        app.kubernetes.io/instance: "liqo-metric-agent"
        app.kubernetes.io/component: "metrics"
        app.kubernetes.io/part-of: "liqo"
        run: metric-agent
    spec:
      securityContext:

        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      serviceAccountName: liqo-metric-agent

      initContainers:
        - name: cert-creator
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          image: ghcr.io/liqotech/cert-creator:v1.3.0
          volumeMounts:
            - mountPath: '/certs'
              name: certs
          command: [ "/usr/bin/openssl" ]
          args:
            - req
            - -x509
            - -subj
            - /C=IT/ST=Turin/O=Liqo
            - -nodes
            - -days
            - "365"
            - -newkey
            - rsa:4096
            - -keyout
            - /certs/key.pem
            - -out
            - /certs/cert.pem
            - -addext
            - subjectAltName = DNS:liqo-metric-agent.liqo.svc
          resources:
            limits: {}
            requests: {}
      containers:
        - image: ghcr.io/liqotech/metric-agent:v1.3.0
          securityContext:
            allowPrivilegeEscalation: false
          name: metric-agent
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/metric-agent"]
          args:
          - --key-path=/certs/key.pem
          - --cert-path=/certs/cert.pem
          - --read-timeout=30s
          - --write-timeout=30s
          - --client-qps=500
          - --client-max-burst=500
          resources:
            limits: {}
            requests: {}
          volumeMounts:
            - mountPath: '/certs'
              name: certs
      volumes:
        - name: certs
          emptyDir: {}
