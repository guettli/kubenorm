spec:
  objectKind:
    apiVersion: networking.liqo.io/v1beta1
    kind: WgGatewayServer
  template:
    metadata:
      name: "{{ .Name }}"
      namespace: "{{ .Namespace }}"
      labels:
        app.kubernetes.io/name: "{{ .Name }}"
        app.kubernetes.io/instance: "liqo-{{ .Name }}"
        app.kubernetes.io/component: "networking"
        app.kubernetes.io/part-of: "liqo"
        app.kubernetes.io/managed-by: "Helm"
        networking.liqo.io/component: "gateway"
        networking.liqo.io/gateway-name: "{{ .Name }}"
        networking.liqo.io/gateway-namespace: "{{ .Namespace }}"
        helm.sh/chart: "liqo-v1.3.0"
        app.kubernetes.io/version: "v1.3.0"
        networking.liqo.io/active: "true"
    spec:
      secretRef:
        name: "{{ .Spec.SecretRef.Name }}"
      service:
        metadata:
          name: "{{ .Name }}"
          namespace: "{{ .Namespace }}"
          labels:
            app.kubernetes.io/name: "{{ .Name }}"
            app.kubernetes.io/instance: "liqo-{{ .Name }}"
            app.kubernetes.io/component: "networking"
            app.kubernetes.io/part-of: "liqo"
            app.kubernetes.io/managed-by: "Helm"
            networking.liqo.io/component: "gateway"
            networking.liqo.io/gateway-name: "{{ .Name }}"
            networking.liqo.io/gateway-namespace: "{{ .Namespace }}"
            helm.sh/chart: "liqo-v1.3.0"
            app.kubernetes.io/version: "v1.3.0"
            networking.liqo.io/active: "true"
        spec:
          selector:
            app.kubernetes.io/name: "{{ .Name }}"
            app.kubernetes.io/instance: "liqo-{{ .Name }}"
            app.kubernetes.io/component: "networking"
            app.kubernetes.io/part-of: "liqo"
            app.kubernetes.io/managed-by: "Helm"
            networking.liqo.io/component: "gateway"
            networking.liqo.io/gateway-name: "{{ .Name }}"
            networking.liqo.io/gateway-namespace: "{{ .Namespace }}"
            networking.liqo.io/active: "true"
          type: "{{ .Spec.Endpoint.ServiceType }}"
          ?loadBalancerIP: "{{ .Spec.Endpoint.LoadBalancerIP }}"
          ports:
          - port: "{{ .Spec.Endpoint.Port }}"
            protocol: UDP
            targetPort: "{{ .Spec.Endpoint.Port }}"
            ?nodePort: "{{ .Spec.Endpoint.NodePort }}"
      deployment:
        metadata:
          name: "{{ .Name }}"
          namespace: "{{ .Namespace }}"
          labels:
            app.kubernetes.io/name: "{{ .Name }}"
            app.kubernetes.io/instance: "liqo-{{ .Name }}"
            app.kubernetes.io/component: "networking"
            app.kubernetes.io/part-of: "liqo"
            app.kubernetes.io/managed-by: "Helm"
            networking.liqo.io/component: "gateway"
            networking.liqo.io/gateway-name: "{{ .Name }}"
            networking.liqo.io/gateway-namespace: "{{ .Namespace }}"
            helm.sh/chart: "liqo-v1.3.0"
            app.kubernetes.io/version: "v1.3.0"
            networking.liqo.io/active: "true"
        spec:
          replicas: 1
          strategy:
            type: Recreate
          selector:
            matchLabels:
              app.kubernetes.io/name: "{{ .Name }}"
              app.kubernetes.io/instance: "liqo-{{ .Name }}"
              app.kubernetes.io/component: "networking"
              app.kubernetes.io/part-of: "liqo"
              app.kubernetes.io/managed-by: "Helm"
              networking.liqo.io/component: "gateway"
              networking.liqo.io/gateway-name: "{{ .Name }}"
              networking.liqo.io/gateway-namespace: "{{ .Namespace }}"
          template:
            metadata:
              name: "{{ .Name }}"
              namespace: "{{ .Namespace }}"
              labels:
                app.kubernetes.io/name: "{{ .Name }}"
                app.kubernetes.io/instance: "liqo-{{ .Name }}"
                app.kubernetes.io/component: "networking"
                app.kubernetes.io/part-of: "liqo"
                app.kubernetes.io/managed-by: "Helm"
                networking.liqo.io/component: "gateway"
                networking.liqo.io/gateway-name: "{{ .Name }}"
                networking.liqo.io/gateway-namespace: "{{ .Namespace }}"
                helm.sh/chart: "liqo-v1.3.0"
                app.kubernetes.io/version: "v1.3.0"
                networking.liqo.io/active: "true"
            spec:
              serviceAccount: "{{ .Name }}"
              serviceAccountName: "{{ .Name }}"

              containers:
              - name: gateway
                image: ghcr.io/liqotech/gateway:v1.3.0
                imagePullPolicy: IfNotPresent
                resources:
                  limits: {}
                  requests: {}
                args:
                - --name={{ .Name }}
                - --namespace={{ .Namespace }}
                - --remote-cluster-id={{ .ClusterID }}
                - --node-name=$(NODE_NAME)
                - --pod-name=$(POD_NAME)
                - --gateway-uid={{ .GatewayUID }}
                - --mode=server
                - --container-name=gateway
                - --concurrent-containers-names=wireguard,geneve
                - --global-labels=liqo.io/managed=true
                - --health-probe-bind-address=:8083
                - --ping-enabled=true
                - --ping-loss-threshold=5
                - --ping-interval=2s
                - --ping-update-status-interval=10s
                - --leader-election=false
                - --enable-nft-monitor=true
                - --enable-route-monitor=true
                - --enable-multipath-hash-policy={{ if gt (len .Spec.Endpoint.Ports) 1 }}true{{ else }}false{{ end }}
                volumeMounts:
                - name: ipc
                  mountPath: /ipc
                ports:
                - containerPort: 8083
                  name: healthz
                # ATTENTION: uncomment the readinessProbe section if you are aware of the consequences.
                # If you have more replicas of the same gateway, the passive ones will not reach the ready state.
                #readinessProbe:
                #  httpGet:
                #    path: /readyz
                #    port: healthz
                env:
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                securityContext:
                  privileged: true
                  capabilities:
                    add:
                    - NET_ADMIN
                    - NET_RAW
              - name: wireguard
                image: ghcr.io/liqotech/gateway/wireguard:v1.3.0
                imagePullPolicy: IfNotPresent
                resources:
                  limits: {}
                  requests: {}
                args:
                - --name={{ .Name }}
                - --namespace={{ .Namespace }}
                - --remote-cluster-id={{ .ClusterID }}
                - --gateway-uid={{ .GatewayUID }}
                - --mode=server
                - --container-name=wireguard
                - --mtu={{ .Spec.MTU }}
                - --listen-ports={{ if .Spec.Endpoint.Ports }}{{ range $i, $p := .Spec.Endpoint.Ports }}{{ if $i }},{{ end }}{{ $p }}{{ end }}{{ else }}{{ .Spec.Endpoint.Port }}{{ end }}
                - --health-probe-bind-address=:8085
                - --leader-election=false
                - --implementation=kernel
                - --preserve-client-endpoint=true
                ports:
                - containerPort: 8085
                  name: healthz
                # ATTENTION: uncomment the readinessProbe section if you are aware of the consequences.
                # If you have more replicas of the same gateway, the passive ones will not reach the ready state.
                #readinessProbe:
                #  httpGet:
                #    path: /readyz
                #    port: healthz
                securityContext:
                  capabilities:
                    add:
                    - NET_ADMIN
                    - NET_RAW
                    - "{{ if gt (len .Spec.Endpoint.Ports) 1 }}SYS_ADMIN{{ else }}NET_RAW{{ end }}"

                volumeMounts:
                - name: ipc
                  mountPath: /ipc
                - name: wireguard-config
                  mountPath: /etc/wireguard/keys
              - name: geneve
                image: ghcr.io/liqotech/gateway/geneve:v1.3.0
                imagePullPolicy: IfNotPresent
                resources:
                  limits: {}
                  requests: {}
                args:
                - --name={{ .Name }}
                - --namespace={{ .Namespace }}
                - --remote-cluster-id={{ .ClusterID }}
                - --node-name=$(NODE_NAME)
                - --pod-name=$(POD_NAME)
                - --gateway-uid={{ .GatewayUID }}
                - --mode=server
                - --container-name=geneve
                - --geneve-port=6091
                - --ping-enabled=true
                - --ping-port=54321
                - --health-probe-bind-address=:8087
                - --leader-election=false
                volumeMounts:
                - name: ipc
                  mountPath: /ipc
                ports:
                - containerPort: 8087
                  name: healthz
                # ATTENTION: uncomment the readinessProbe section if you are aware of the consequences.
                # If you have more replicas of the same gateway, the passive ones will not reach the ready state.
                #readinessProbe:
                #  httpGet:
                #    path: /readyz
                #    port: healthz
                env:
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                securityContext:
                  capabilities:
                    add:
                    - NET_ADMIN
                    - NET_RAW
              volumes:
              - name: wireguard-config
                secret:
                  secretName: "{{ .SecretName }}"
              - name: ipc
                emptyDir: {}
