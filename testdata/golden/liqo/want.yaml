apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  labels:
    app.kubernetes.io/component: webhook
    app.kubernetes.io/instance: liqo-webhook
    app.kubernetes.io/name: webhook
    app.kubernetes.io/part-of: liqo
    app.kubernetes.io/version: v1.3.0
    liqo.io/webhook: "true"
  name: liqo-webhook
webhooks:
- admissionReviewVersions:
  - v1
  - v1beta1
  clientConfig:
    service:
      name: liqo-webhook
      namespace: liqo
      path: /mutate/pod
      port: 9443
  name: pod.mutate.liqo.io
  namespaceSelector:
    matchLabels:
      liqo.io/scheduling-enabled: "true"
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - pods
  sideEffects: None
- admissionReviewVersions:
  - v1
  - v1beta1
  clientConfig:
    service:
      name: liqo-webhook
      namespace: liqo
      path: /mutate/shadowpods
      port: 9443
  name: shadowpod.mutate.liqo.io
  rules:
  - apiGroups:
    - offloading.liqo.io
    apiVersions:
    - v1beta1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - shadowpods
  sideEffects: None
- admissionReviewVersions:
  - v1
  - v1beta1
  clientConfig:
    service:
      name: liqo-webhook
      namespace: liqo
      path: /mutate/foreign-cluster
      port: 9443
  name: fc.mutate.liqo.io
  objectSelector:
    matchExpressions:
    - key: liqo.io/webhook-skip
      operator: NotIn
      values:
      - "true"
  rules:
  - apiGroups:
    - core.liqo.io
    apiVersions:
    - v1beta1
    operations:
    - CREATE
    - UPDATE
    resources:
    - foreignclusters
  sideEffects: None
- admissionReviewVersions:
  - v1
  - v1beta1
  clientConfig:
    service:
      name: liqo-webhook
      namespace: liqo
      path: /mutate/firewallconfigurations
      port: 9443
  name: firewallconfiguration.mutate.liqo.io
  objectSelector:
    matchExpressions:
    - key: liqo.io/webhook-skip
      operator: NotIn
      values:
      - "true"
  rules:
  - apiGroups:
    - networking.liqo.io
    apiVersions:
    - v1beta1
    operations:
    - CREATE
    - UPDATE
    resources:
    - firewallconfigurations
  sideEffects: None
- admissionReviewVersions:
  - v1
  - v1beta1
  clientConfig:
    service:
      name: liqo-webhook
      namespace: liqo
      path: /mutate/tenants
      port: 9443
  name: tenant.validate.liqo.io
  objectSelector:
    matchExpressions:
    - key: liqo.io/webhook-skip
      operator: NotIn
      values:
      - "true"
  rules:
  - apiGroups:
    - authentication.liqo.io
    apiVersions:
    - v1beta1
    operations:
    - CREATE
    - UPDATE
    resources:
    - tenants
  sideEffects: None
