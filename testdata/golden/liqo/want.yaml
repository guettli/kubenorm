  selector:
    matchLabels:
      app.kubernetes.io/component: networking
      app.kubernetes.io/instance: liqo-fabric
      app.kubernetes.io/name: fabric
      app.kubernetes.io/part-of: liqo
  template:
    metadata:
      labels:
        app.kubernetes.io/component: networking
        app.kubernetes.io/instance: liqo-fabric
        app.kubernetes.io/name: fabric
        app.kubernetes.io/part-of: liqo
        networking.liqo.io/component: fabric
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: liqo.io/type
                operator: NotIn
                values:
                - virtual-node
      containers:
      - args:
        - --podname=$(POD_NAME)
        - --nodename=$(NODE_NAME)
        - --geneve-port=6091
        - --health-probe-bind-address=:8081
        - --metrics-address=:8082
        - --ping-enabled=true
        - --ping-port=54321
        - --ping-loss-threshold=5
        - --ping-interval=10s
        - --ping-update-status-interval=10s
        - --enable-nft-monitor=false
        - --enable-route-monitor=true
        - --global-labels=liqo.io/managed=true
        command:
        - /usr/bin/fabric
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        image: ghcr.io/liqotech/fabric:v1.3.0
        name: fabric
        ports:
        - containerPort: 8081
          name: healthz
        readinessProbe:
          httpGet:
            path: /readyz
            port: healthz
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
          privileged: true
      hostNetwork: true
      serviceAccountName: liqo-fabric
      tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
      - effect: NoSchedule
        key: node-role.kubernetes.io/infra
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
