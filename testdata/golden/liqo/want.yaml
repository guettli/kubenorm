  labels:
    app.kubernetes.io/component: metrics
    app.kubernetes.io/instance: liqo-metric-agent
    app.kubernetes.io/name: metric-agent
    app.kubernetes.io/part-of: liqo
    app.kubernetes.io/version: v1.3.0
  name: liqo-metric-agent
  namespace: liqo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: metrics
      app.kubernetes.io/instance: liqo-metric-agent
      app.kubernetes.io/name: metric-agent
      app.kubernetes.io/part-of: liqo
      run: metric-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/component: metrics
        app.kubernetes.io/instance: liqo-metric-agent
        app.kubernetes.io/name: metric-agent
        app.kubernetes.io/part-of: liqo
        run: metric-agent
    spec:
      containers:
      - args:
        - --key-path=/certs/key.pem
        - --cert-path=/certs/cert.pem
        - --read-timeout=30s
        - --write-timeout=30s
        - --client-qps=500
        - --client-max-burst=500
        command:
        - /usr/bin/metric-agent
        image: ghcr.io/liqotech/metric-agent:v1.3.0
        name: metric-agent
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - mountPath: /certs
          name: certs
      initContainers:
      - args:
        - req
        - -x509
        - -subj
        - /C=IT/ST=Turin/O=Liqo
        - -nodes
        - -days
        - "365"
        - -newkey
        - rsa:4096
        - -keyout
        - /certs/key.pem
        - -out
        - /certs/cert.pem
        - -addext
        - subjectAltName = DNS:liqo-metric-agent.liqo.svc
        command:
        - /usr/bin/openssl
        image: ghcr.io/liqotech/cert-creator:v1.3.0
        name: cert-creator
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - mountPath: /certs
          name: certs
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: liqo-metric-agent
      volumes:
      - emptyDir: {}
        name: certs
