apiVersion: offloading.liqo.io/v1beta1
kind: VkOptionsTemplate
metadata:
  labels:
    app.kubernetes.io/component: virtualkubelet
    app.kubernetes.io/instance: liqo-virtual-kubelet
    app.kubernetes.io/name: virtual-kubelet
    app.kubernetes.io/part-of: liqo
    app.kubernetes.io/version: v1.3.0
  name: virtual-kubelet-default
  namespace: liqo
spec:
  annotationsNotReflected:
  - cloud.google.com/neg
  - cloud.google.com/neg-status
  - kubernetes.digitalocean.com/load-balancer-id
  - ingress.kubernetes.io/backends
  - ingress.kubernetes.io/forwarding-rule
  - ingress.kubernetes.io/target-proxy
  - ingress.kubernetes.io/url-map
  - metallb.universe.tf/address-pool
  - metallb.universe.tf/ip-allocated-from-pool
  - metallb.universe.tf/loadBalancerIPs
  - loadbalancer.openstack.org/load-balancer-id
  containerImage: ghcr.io/liqotech/virtual-kubelet:v1.3.0
  createNode: true
  disableNetworkCheck: false
  extraArgs:
  - --enable-apiserver-support=true
  metricsEnabled: false
  pullPolicy: IfNotPresent
  reflectorsConfig:
    configmap:
      type: DenyList
      workers: 3
    endpointslice:
      workers: 10
    event:
      type: DenyList
      workers: 3
    ingress:
      type: DenyList
      workers: 3
    persistentvolumeclaim:
      workers: 3
    pod:
      workers: 10
    secret:
      type: DenyList
      workers: 3
    service:
      type: DenyList
      workers: 3
    serviceaccount:
      workers: 3
  replicas: 1
  resources:
    limits: {}
    requests: {}
