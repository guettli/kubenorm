---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: empty-values
spec:
  matchConstraints:
    matchPolicy: Exact
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      resources:
      - configmaps
      scope: Namespaced
  mutations:
  - applyConfiguration:
      expression: Object{}
    patchType: ApplyConfiguration
  reinvocationPolicy: Never
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: empty-values
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - DELETE
      resources:
      - namespaces
  validations:
  - expression: "false"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: empty-values
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    url: https://a.example.com/x
  name: a.example.com
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - configmaps
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    url: https://b.example.com/x
  failurePolicy: Ignore
  name: b.example.com
  sideEffects: None
---
apiVersion: v1
kind: Service
metadata:
  name: empty-values
  namespace: default
spec:
  ports:
  - port: 80
  selector:
    app: empty-values
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: empty-values
  namespace: default
spec:
  selector:
    matchLabels:
      app: empty-values
  template:
    metadata:
      labels:
        app: empty-values
    spec:
      containers:
      - env:
        - name: EMPTY
        - name: SET
          value: x
        envFrom:
        - configMapRef:
            name: cm
        - prefix: APP_
          secretRef:
            name: s
        image: busybox:1.36
        livenessProbe:
          exec:
            command:
            - "true"
        name: main
        ports:
        - containerPort: 80
        - containerPort: 81
          name: metrics
        readinessProbe:
          exec:
            command:
            - "true"
          initialDelaySeconds: 5
        securityContext:
          capabilities:
            drop:
            - ALL
        tty: true
        volumeMounts:
        - mountPath: /a
          name: e
        - mountPath: /b
          name: m
          readOnly: true
          subPath: b
        workingDir: /data
      initContainers:
      - env:
        - name: EMPTY
        image: busybox:1.36
        name: init
      volumes:
      - emptyDir: {}
        name: e
      - emptyDir:
          medium: Memory
        name: m
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: empty-values
  namespace: default
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - env:
            - name: EMPTY
            image: busybox:1.36
            name: job
          restartPolicy: OnFailure
  schedule: 0 * * * *
---
apiVersion: batch/v1
kind: Job
metadata:
  name: empty-values
  namespace: default
spec:
  template:
    spec:
      containers:
      - image: busybox:1.36
        name: job
      restartPolicy: Never
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: empty-values
  namespace: default
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
