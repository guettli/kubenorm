# Empty and zero values the API server drops (omitempty fields), as Helm
# often renders them. Normalizing the output of
# kubectl create --dry-run=server -f input.yaml gives want.yaml, too
# (apart from replicas: 1 and the Job controller labels' uid).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: empty-values
  namespace: default
spec:
  paused: false
  selector:
    matchLabels:
      app: empty-values
  template:
    metadata:
      labels:
        app: empty-values
    spec:
      hostPID: false
      hostIPC: false
      hostname: ""
      nodeName: ""
      priorityClassName: ""
      serviceAccountName: ""
      subdomain: ""
      imagePullSecrets: []
      tolerations: []
      volumes:
      - name: e
        emptyDir:
          medium: ""
      - name: m
        emptyDir:
          medium: Memory
      initContainers:
      - name: init
        image: busybox:1.36
        workingDir: ""
        env:
        - name: EMPTY
          value: ""
      containers:
      - name: main
        image: busybox:1.36
        workingDir: /data
        args: []
        stdin: false
        stdinOnce: false
        tty: true
        envFrom:
        - prefix: ""
          configMapRef:
            name: cm
        - prefix: APP_
          secretRef:
            name: s
        env:
        - name: EMPTY
          value: ""
        - name: SET
          value: x
        ports:
        - containerPort: 80
          name: ""
          hostIP: ""
          hostPort: 0
        - containerPort: 81
          name: metrics
        volumeMounts:
        - name: e
          mountPath: /a
          readOnly: false
          subPath: ""
          subPathExpr: ""
        - name: m
          mountPath: /b
          readOnly: true
          subPath: b
        livenessProbe:
          initialDelaySeconds: 0
          exec:
            command: ["true"]
        readinessProbe:
          initialDelaySeconds: 5
          exec:
            command: ["true"]
        securityContext:
          capabilities:
            add: []
            drop: [ALL]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: empty-values
  namespace: default
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: job
            image: busybox:1.36
            workingDir: ""
            env:
            - name: EMPTY
              value: ""
---
# Labels the Job controller sets on the Job itself.
apiVersion: batch/v1
kind: Job
metadata:
  name: empty-values
  namespace: default
  labels:
    batch.kubernetes.io/controller-uid: 6922ef32-1ea0-47ad-937e-1965006bf584
    batch.kubernetes.io/job-name: empty-values
    controller-uid: 6922ef32-1ea0-47ad-937e-1965006bf584
    job-name: empty-values
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: job
        image: busybox:1.36
---
apiVersion: v1
kind: Service
metadata:
  name: empty-values
  namespace: default
spec:
  selector:
    app: empty-values
  externalIPs: []
  publishNotReadyAddresses: false
  ports:
  - port: 80
    name: ""
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: empty-values
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [DELETE]
      resources: [namespaces]
      scope: "*"
  validations:
  - expression: "false"
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: empty-values
spec:
  failurePolicy: Fail
  reinvocationPolicy: Never
  matchConstraints:
    matchPolicy: Exact
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE]
      resources: [configmaps]
      scope: Namespaced
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      expression: "Object{}"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: empty-values
webhooks:
- name: a.example.com
  failurePolicy: Fail
  sideEffects: None
  admissionReviewVersions: [v1]
  clientConfig:
    url: https://a.example.com/x
  rules:
  - apiGroups: [""]
    apiVersions: [v1]
    operations: [CREATE]
    resources: [configmaps]
- name: b.example.com
  failurePolicy: Ignore
  sideEffects: None
  admissionReviewVersions: [v1]
  clientConfig:
    url: https://b.example.com/x
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: empty-values
  namespace: default
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get]
  resourceNames: []
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: empty-values
spec:
  policyName: empty-values
  validationActions: [Deny]
  matchResources:
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    excludeResourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [DELETE]
      resources: [namespaces]
      resourceNames: [kube-system]
      scope: "*"
---
# Not a built-in API: default: [] and default: null are kept.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.com
spec:
  group: example.com
  names:
    kind: Widget
    plural: widgets
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              tags:
                type: array
                items:
                  type: string
                default: []
              note:
                type: string
                nullable: true
                default: null
---
# A custom resource in a *.k8s.io group: rules: [] (no rules) differs from
# an absent rules (the schema default, one rule matching /).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: empty-values
  namespace: default
spec:
  rules: []
