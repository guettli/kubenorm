# Empty optional strings in a pod template. The API server drops them
# (verified with kubectl apply --dry-run=server), so kubenorm does too.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: empty-strings
  namespace: default
spec:
  selector:
    matchLabels:
      app: empty-strings
  template:
    metadata:
      labels:
        app: empty-strings
    spec:
      initContainers:
      - name: init
        image: busybox:1.36
        workingDir: ""
        env:
        - name: EMPTY
          value: ""
      containers:
      - name: main
        image: busybox:1.36
        workingDir: /data
        envFrom:
        - prefix: ""
          configMapRef:
            name: cm
        - prefix: APP_
          secretRef:
            name: s
        env:
        - name: EMPTY
          value: ""
        - name: SET
          value: x
        volumeMounts:
        - name: v
          mountPath: /a
          subPath: ""
        - name: v
          mountPath: /b
          subPath: b
      volumes:
      - name: v
        emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: empty-strings
  namespace: default
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: job
            image: busybox:1.36
            workingDir: ""
            env:
            - name: EMPTY
              value: ""
