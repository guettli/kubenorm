# Metadata that controllers write at runtime (found by diffing live clusters
# against their rendered manifests).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: default
  annotations:
    reloader.stakater.com/auto: "true"
    reloader.stakater.com/last-reloaded-from: '{"type":"SECRET","name":"app"}'
spec:
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
      annotations:
        reloader.stakater.com/last-reloaded-from: '{"type":"SECRET","name":"app"}'
    spec:
      containers:
      - name: app
        image: busybox:1.36
---
# Set by the scheduler for WaitForFirstConsumer volumes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: default
  annotations:
    volume.kubernetes.io/selected-node: node1
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
# caBundle injected by cert-manager.
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.webhook.example.com
  annotations:
    cert-manager.io/inject-ca-from: default/webhook-tls
spec:
  caBundle: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCg==
  group: webhook.example.com
  groupPriorityMinimum: 1000
  versionPriority: 15
  version: v1alpha1
  service:
    name: webhook
    namespace: default
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app
  namespace: default
  finalizers:
  - finalizers.fluxcd.io
spec:
  interval: 10m
  path: ./deploy
  prune: true
  sourceRef:
    kind: GitRepository
    name: app
---
apiVersion: actions.github.com/v1alpha1
kind: AutoscalingRunnerSet
metadata:
  name: runners
  namespace: default
  annotations:
    actions.github.com/values-hash: 4232ab
    actions.github.com/change-hash: 7769685dd8
    actions.github.com/runner-group-name: Default
    actions.github.com/runner-scale-set-name: runners
    runner-scale-set-id: "7"
  labels:
    actions.github.com/scale-set-name: runners
    actions.github.com/organization: example
    actions.github.com/repository: app
  finalizers:
  - autoscalingrunnerset.actions.github.com/finalizer
spec:
  githubConfigUrl: https://github.com/example/app
