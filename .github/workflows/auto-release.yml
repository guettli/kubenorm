name: Auto Release

# Releases a commit of main only after CI passed for it, so a failing check
# (tests, API compatibility) blocks the release, and no release tag exists
# while CI checks the commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    # Every 6 hours — catches unreleased commits if an event was missed
    - cron: '0 */6 * * *'

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Installs the tools of mise.toml (go, prek, ...), also the go that
      # builds the release binaries.
      - uses: jdx/mise-action@v5

      # setup-go cached these; mise-action caches only the tools.
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-${{ runner.os }}-

      - name: Check that CI passed and HEAD is the tip of main
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          # A newer commit releases this one too; releasing an older commit
          # after it would tag the wrong commit.
          if [ "$sha" != "$(git rev-parse origin/main)" ]; then
            echo "$sha is not the tip of main, skipping"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The schedule has no CI run of its own: look it up.
          conclusion=$(gh run list --workflow ci.yml --commit "$sha" --event push --json conclusion -q '.[0].conclusion')
          if [ "$conclusion" != "success" ]; then
            echo "CI of $sha: ${conclusion:-not run}, skipping"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Check if HEAD needs a release
        id: check
        if: steps.ci.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use --list 'v*' so a non-version tag (e.g. 'latest') never suppresses a release
          CURRENT_TAG=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -1)
          if [ -n "$CURRENT_TAG" ]; then
            # HEAD is tagged — check if the GitHub Release also exists
            if gh release view "$CURRENT_TAG" > /dev/null 2>&1; then
              echo "new_release=false" >> "$GITHUB_OUTPUT"
            else
              # Tag exists but release is missing — recover by creating the release
              echo "new_release=true" >> "$GITHUB_OUTPUT"
              echo "new_tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
            fi
          else
            # HEAD is untagged — every merge to main bumps the minor version.
            # A patch or major release is tagged by hand (the tag on HEAD
            # makes this job create the release, see above).
            # Pre-release tags (v1.2.0-rc.1) do not count.
            LATEST=$(git describe --tags --abbrev=0 --match 'v*' --exclude 'v*-*' 2>/dev/null || echo 'v0.0.0')
            MAJOR=$(echo "$LATEST" | cut -d. -f1 | tr -d 'v')
            MINOR=$(echo "$LATEST" | cut -d. -f2)
            NEW_TAG="v${MAJOR}.$((MINOR + 1)).0"
            echo "new_release=true" >> "$GITHUB_OUTPUT"
            echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Push tag
        if: steps.check.outputs.new_release == 'true'
        run: |
          NEW_TAG="${{ steps.check.outputs.new_tag }}"
          # Skip if the tag already exists locally (recovery: tag was pushed in a prior failed run)
          if git tag --list "$NEW_TAG" | grep -q .; then
            echo "Tag $NEW_TAG already exists, skipping push"
          else
            git tag "$NEW_TAG"
            git push origin "$NEW_TAG"
          fi

      - name: Build binaries
        if: steps.check.outputs.new_release == 'true'
        run: |
          # HEAD is now at the release tag, go build embeds the version. Build
          # outside the checkout: files in it would mark the version +dirty.
          dist=$RUNNER_TEMP/dist
          mkdir -p "$dist"
          GOOS=linux   GOARCH=amd64 go build -trimpath -o "$dist/kubenorm-linux-amd64"   .
          GOOS=linux   GOARCH=arm64 go build -trimpath -o "$dist/kubenorm-linux-arm64"   .
          GOOS=darwin  GOARCH=amd64 go build -trimpath -o "$dist/kubenorm-darwin-amd64"  .
          GOOS=darwin  GOARCH=arm64 go build -trimpath -o "$dist/kubenorm-darwin-arm64"  .
          GOOS=windows GOARCH=amd64 go build -trimpath -o "$dist/kubenorm-windows-amd64.exe" .

      - name: Generate checksums
        if: steps.check.outputs.new_release == 'true'
        run: cd "$RUNNER_TEMP/dist" && sha256sum kubenorm-* > checksums.txt

      - name: Create GitHub Release
        if: steps.check.outputs.new_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.check.outputs.new_tag }}" \
            --title "${{ steps.check.outputs.new_tag }}" \
            --generate-notes \
            "$RUNNER_TEMP"/dist/*
