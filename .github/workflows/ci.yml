name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Installs the tools of mise.toml (go, prek, ...): the same versions as
      # on a developer machine.
      - uses: jdx/mise-action@v5

      # setup-go cached these; mise-action caches only the tools.
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-${{ runner.os }}-

      - name: Run prek
        # Fails if a hook changed files (go mod tidy, usage.md, README).
        run: prek run --all-files --show-diff-on-failure

  defaults:
    # Checks the default rules against a real kube-apiserver (envtest
    # binaries, no container runtime needed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Installs the tools of mise.toml (go, ...).
      - uses: jdx/mise-action@v5

      # setup-go cached these; mise-action caches only the tools.
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-${{ runner.os }}-

      - name: Check defaults
        run: scripts/check-defaults.sh

  api-compat:
    # Every merge is a minor release, so the API of package normalize must
    # stay compatible with the latest release (semver v1).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Installs the tools of mise.toml (go, ...).
      - uses: jdx/mise-action@v5

      # setup-go cached these; mise-action caches only the tools.
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-${{ runner.os }}-

      - name: Check API compatibility
        env:
          # Fetch the base release from git: the Go proxy and checksum
          # database may not know a release that was tagged minutes ago.
          GOPRIVATE: github.com/guettli/kubenorm
        run: |
          # On main, auto-release may have tagged this commit already, and
          # gorelease refuses a version that exists. The pull request ran the
          # check on the same code, so skip it.
          tag=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -1)
          if [ -n "$tag" ]; then
            echo "HEAD is already released as $tag, checked in its pull request"
            exit 0
          fi
          base=$(git describe --tags --abbrev=0 --match 'v*')
          next=$(echo "$base" | awk -F. '{print $1"."$2+1".0"}')
          go run golang.org/x/exp/cmd/gorelease@v0.0.0-20261113113407-e3970619a1a4 -base="$base" -version="$next"
