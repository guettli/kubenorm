# Works with pre-commit and prek: `prek run --all-files`
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  # Golden files are compared byte by byte: a diff context line of an empty
  # YAML line ends with a space.
  - id: trailing-whitespace
    exclude: ^testdata/golden(-diff)?/
  - id: end-of-file-fixer
    exclude: ^testdata/golden(-diff)?/
  - id: check-added-large-files
  - id: check-merge-conflict
  - id: check-yaml
    args: [--allow-multiple-documents]

- repo: https://github.com/betterleaks/betterleaks
  rev: v1.10.1
  hooks:
    - id: betterleaks
      args: [--config, .betterleaks.toml]

- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.11.0.1
  hooks:
    - id: shellcheck
      args: [--severity=warning]

- repo: local
  hooks:
  - id: go-mod-tidy
    name: go mod tidy
    language: system
    entry: go mod tidy
    pass_filenames: false
    always_run: true

  - id: go-test
    name: Go tests
    language: system
    entry: go test ./...
    pass_filenames: false
    always_run: true

  - id: go-lint
    name: Go lint
    language: system
    entry: golangci-lint run # version pinned in mise.toml
    pass_filenames: false
    always_run: true

  - id: gendocs
    name: Generate usage.md
    language: system
    entry: go run . gendocs
    pass_filenames: false
    always_run: true

  - id: update-readme-usage
    name: Update README usage block
    language: script
    entry: scripts/update-readme.sh
    pass_filenames: false
    always_run: true
