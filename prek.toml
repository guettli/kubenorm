# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"
hooks = [
  # Golden files are compared byte by byte: a diff context line of an empty
  # YAML line ends with a space.
  {
    id = "trailing-whitespace",
    exclude = "^testdata/golden(-diff)?/"
  },
  {
    id = "end-of-file-fixer",
    exclude = "^testdata/golden(-diff)?/"
  },
  { id = "check-added-large-files" },
  { id = "check-merge-conflict" },
  {
    id = "check-yaml",
    args = ["--allow-multiple-documents"]
  }
]

# Block commits that contain secrets. betterleaks is pinned in mise.toml.
[[repos]]
repo = "local"
hooks = [
  {
    id = "betterleaks",
    name = "betterleaks (secrets)",
    entry = "mise exec betterleaks -- betterleaks git --pre-commit --staged --redact --verbose --config .betterleaks.toml",
    language = "system",
    pass_filenames = false
  }
]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1"
hooks = [
  {
    id = "shellcheck",
    args = ["--severity=warning"]
  }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "go-mod-tidy",
    name = "go mod tidy",
    language = "system",
    entry = "go mod tidy",
    pass_filenames = false,
    always_run = true
  },
  {
    id = "go-test",
    name = "Go tests",
    language = "system",
    entry = "go test ./...",
    pass_filenames = false,
    always_run = true
  },
  {
    id = "go-lint",
    name = "Go lint",
    language = "system",
    # version pinned in mise.toml
    entry = "golangci-lint run",
    pass_filenames = false,
    always_run = true
  },
  {
    id = "gendocs",
    name = "Generate usage.md",
    language = "system",
    entry = "go run . gendocs",
    pass_filenames = false,
    always_run = true
  },
  {
    id = "update-readme-usage",
    name = "Update README usage block",
    language = "script",
    entry = "scripts/update-readme.sh",
    pass_filenames = false,
    always_run = true
  }
]
